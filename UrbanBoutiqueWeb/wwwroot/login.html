<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Urban Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div style="text-align:center; margin-bottom:24px;">
            <div class="logo-icon" style="margin: 0 auto 14px; width:56px; height:56px; font-size:1.5rem;"><i class="fas fa-store"></i></div>
            <h2>URBAN <span style="color:var(--accent);">BOUTIQUE</span></h2>
            <p class="subtitle" id="form-subtitle">Sign in to your account</p>
        </div>

        <!-- Tab switcher -->
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-mode="login" onclick="switchAuthMode('login')">Sign In</button>
            <button type="button" class="auth-tab" data-mode="register" onclick="switchAuthMode('register')">Sign Up</button>
        </div>

        <div id="error-message" class="error-msg" style="display:none;"></div>

        <!-- Sign In -->
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="login-username" placeholder="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt"></i> Sign In</button>
        </form>

        <!-- Sign Up -->
        <form id="register-form" class="auth-form" style="display:none;">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" placeholder="Choose a username" autocomplete="username" minlength="3" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Choose a password (min 4)" autocomplete="new-password" minlength="4" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" id="reg-password2" placeholder="Retype password" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100"><i class="fas fa-user-plus"></i> Create Account</button>
        </form>

        <div class="login-hint" id="login-hint">
            Default admin: <code>admin</code> / <code>admin123</code>
        </div>

        <div style="text-align:center; margin-top:20px;">
            <a href="/" style="color:var(--text-muted); font-size:0.85rem; text-decoration:none;">
                <i class="fas fa-arrow-left"></i> Back to storefront
            </a>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Open the correct tab if navigated from "Sign Up" button
        if (sessionStorage.getItem('auth_mode') === 'register') {
            sessionStorage.removeItem('auth_mode');
            window.addEventListener('DOMContentLoaded', () => switchAuthMode('register'));
        }

        function switchAuthMode(mode) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
            document.getElementById('login-form').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('register-form').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('form-subtitle').textContent =
                mode === 'login' ? 'Sign in to your account' : 'Create a new customer account';
            document.getElementById('login-hint').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('error-message').style.display = 'none';
        }

        document.getElementById('login-form').addEventListener('submit', async e => {
            e.preventDefault();
            await login(
                document.getElementById('login-username').value.trim(),
                document.getElementById('login-password').value
            );
        });

        document.getElementById('register-form').addEventListener('submit', async e => {
            e.preventDefault();
            const u = document.getElementById('reg-username').value.trim();
            const p = document.getElementById('reg-password').value;
            const p2 = document.getElementById('reg-password2').value;
            const err = document.getElementById('error-message');
            if (p !== p2) {
                err.textContent = 'Passwords do not match';
                err.style.display = 'block';
                return;
            }
            await register(u, p);
        });
    </script>
</body>
</html>
