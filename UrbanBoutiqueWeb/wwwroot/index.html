<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Boutique — Storefront</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-body">
    <nav class="top-navbar storefront-navbar">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-store"></i></div>
            <span>URBAN <strong>BOUTIQUE</strong></span>
        </div>
        <div class="storefront-search">
            <div class="search-bar">
                <input type="text" id="store-search-input" placeholder="Search clothing, accessories, footwear...">
                <button onclick="searchStorefront()"><i class="fas fa-search"></i></button>
            </div>
        </div>
        <div class="user-profile" id="storefront-user-area">
            <!-- populated by JS -->
        </div>
    </nav>

    <div class="main-container storefront-container">
        <aside class="side-nav storefront-sidebar">
            <h3>Categories</h3>
            <ul class="nav-menu" id="storefront-categories">
                <li class="active" onclick="filterStorefront('', this)">All Products</li>
            </ul>
        </aside>

        <main class="content-area">
            <div class="page-header">
                <div>
                    <h2>Our Collection</h2>
                    <p class="subtitle">Discover the latest urban fashion trends</p>
                </div>
            </div>

            <div class="products-grid" id="storefront-products"></div>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        (async () => {
            await renderStorefrontUserArea();
            loadStorefront();
        })();
    </script>
</body>
</html>
